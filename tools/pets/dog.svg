    <g stroke="#3a3936" stroke-width="1.35"><circle cx="549.0" cy="738.0" r="5.2" fill="#f6f3ee"/><circle cx="546.7" cy="742.7" r="5.2" fill="#f6f3ee"/><circle cx="541.7" cy="743.8" r="5.2" fill="#f6f3ee"/><circle cx="537.6" cy="740.6" r="5.2" fill="#f6f3ee"/><circle cx="537.6" cy="735.4" r="5.2" fill="#f6f3ee"/><circle cx="541.7" cy="732.2" r="5.2" fill="#f6f3ee"/><circle cx="546.7" cy="733.3" r="5.2" fill="#f6f3ee"/><circle cx="585.0" cy="738.0" r="5.2" fill="#f6f3ee"/><circle cx="582.7" cy="742.7" r="5.2" fill="#f6f3ee"/><circle cx="577.7" cy="743.8" r="5.2" fill="#f6f3ee"/><circle cx="573.6" cy="740.6" r="5.2" fill="#f6f3ee"/><circle cx="573.6" cy="735.4" r="5.2" fill="#f6f3ee"/><circle cx="577.7" cy="732.2" r="5.2" fill="#f6f3ee"/><circle cx="582.7" cy="733.3" r="5.2" fill="#f6f3ee"/></g>
    <g stroke="#3a3936" stroke-width="1.45"><circle cx="575.0" cy="731.0" r="5.4" fill="#f6f3ee"/><circle cx="573.1" cy="738.0" r="5.4" fill="#f6f3ee"/><circle cx="568.0" cy="743.1" r="5.4" fill="#f6f3ee"/><circle cx="561.0" cy="745.0" r="5.4" fill="#f6f3ee"/><circle cx="554.0" cy="743.1" r="5.4" fill="#f6f3ee"/><circle cx="548.9" cy="738.0" r="5.4" fill="#f6f3ee"/><circle cx="547.0" cy="731.0" r="5.4" fill="#f6f3ee"/><circle cx="548.9" cy="724.0" r="5.4" fill="#f6f3ee"/><circle cx="554.0" cy="718.9" r="5.4" fill="#f6f3ee"/><circle cx="561.0" cy="717.0" r="5.4" fill="#f6f3ee"/><circle cx="568.0" cy="718.9" r="5.4" fill="#f6f3ee"/><circle cx="573.1" cy="724.0" r="5.4" fill="#f6f3ee"/></g>
