    <path d="M551.2 724.6 Q555.4 721.4 559.6 724.2" fill="none" stroke="#1f1e22" stroke-width="2.6"/>
    <path d="M550 720 q4 -5 8 -1 q4 -5 8 -1 q4 -4 7 1" fill="none" stroke="#d8d1c6" stroke-width="1.2"/>
    <g class="dog-eyes" style="transform-origin:561px 728.5px"><circle cx="555.5" cy="728.5" r="2.1" fill="#1f1e22"/><circle cx="567" cy="728.5" r="2.1" fill="#1f1e22"/></g>
    <ellipse cx="561" cy="738.5" rx="8" ry="5.6" fill="#fbf9f4" stroke="#cfc8bc" stroke-width="1"/>
