  <path d="M6.2 35.6 C5.2 35.6 5 31.8 6.8 31.8 L20 31.6 L20 35.6 Z" fill="#f6f3ee" stroke="#3a3936" stroke-width="1.05"/>
  <path d="M5.4 36.6 v1.4 M7.2 36.6 v1.4 M8 33.9 v1.4 M9.8 33.9 v1.4" stroke="#3a3936" stroke-width="0.6" fill="none"/>
  <!-- bandana -->
  <g transform="translate(15.5 21.6) scale(0.5) translate(-561 -731)" stroke="#3a3936" stroke-width="1.8" stroke-linejoin="round">
    <path d="M546 744.5 Q561 750.5 576 744.5 L573.5 749.5 L561 761.5 L548.5 749.5 Z" fill="#c8372d"/>
    <circle cx="556" cy="752" r="1.2" fill="#f6f3ee" stroke="none"/><circle cx="566" cy="752" r="1.2" fill="#f6f3ee" stroke="none"/><circle cx="561" cy="756.5" r="1.2" fill="#f6f3ee" stroke="none"/>
  </g>
