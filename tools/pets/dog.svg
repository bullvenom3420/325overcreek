  <!-- back leg folded under the hip -->
  <path d="M41 38 C40 33 44 29.5 48.5 30.5 C52.5 31.5 53 36 51 38 Z" fill="#f6f3ee" stroke="#3a3936" stroke-width="1.1"/>
  <path d="M38.5 38.2 C38.5 36 40.5 35 42.5 35 L48 35 C50 35 50.5 38.2 48.5 38.2 Z" fill="#f6f3ee" stroke="#3a3936" stroke-width="1.05"/>
  <!-- front legs stretched out in front of him -->
