<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="900" height="600"><title>Huckleberry, lying down (325 Overcreek)</title>
<g class="pet-dog" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="31" cy="38.6" rx="28" ry="1.3" fill="#000" opacity=".12"/>
  <!-- tail curled up over his back hip; wags from its base -->
  <g class="dog-tail"><path d="M50 25 C56 22 57 15 52 12" fill="none" stroke="#3a3936" stroke-width="6"/><path d="M50 25 C56 22 57 15 52 12" fill="none" stroke="#f6f3ee" stroke-width="4"/>
    <circle cx="51.8" cy="11.6" r="3" fill="#f6f3ee" stroke="#3a3936" stroke-width="1"/></g>
  <!-- body lying flat, side on: chest at the left, round hip at the right -->
